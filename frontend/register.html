<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AI Recipe Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Plus Jakarta Sans',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#FFF8E7,#FFE9D2,#FFF4CC);
      overflow-x:hidden;
      position:relative;
    }

    .background{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }

    .food{
      position:absolute;
      font-size:45px;
      animation:move 12s linear infinite;
      opacity:.8;
    }
    .food1{ left:5%; top:15%; }
    .food3{ left:15%; top:75%; }
    .food5{ left:50%; top:5%; }
    .food6{ left:90%; top:50%; }
    .food7{ left:30%; top:40%; }

    @keyframes move{
      50%{ transform:translateY(-40px) rotate(20deg); }
      100%{ transform:translateY(0px) rotate(0deg); }
    }

    .container{
      position:relative;
      z-index:1;
      width:100%;
      min-height:100vh;
      display:flex;
      flex-wrap:wrap;
      justify-content:space-evenly;
      align-items:center;
      gap:40px;
      padding:60px 40px;
    }

    .left{
      width:45%;
      min-width:280px;
      text-align:center;
      position:relative;
    }

    .chef{
      width:280px;
      height:280px;
      max-width:70%;
      border-radius:50%;
      background:#fff;
      object-fit:contain;
      box-shadow:0 20px 50px rgba(255,107,0,.2);
      animation:float 4s ease-in-out infinite;
    }

    @keyframes float{
      50%{ transform:translateY(-20px); }
    }

    .left h1{
      font-size:clamp(1.7rem, 4vw, 2.6rem);
      margin-top:20px;
      color:#ff6b00;
    }

    .left p{
      margin-top:15px;
      font-size:1.1rem;
      color:#555;
      line-height:1.7;
    }

    .right{
      width:420px;
      max-width:100%;
    }

    .register-card{
      background:white;
      padding:45px;
      border-radius:30px;
      box-shadow:0 25px 60px rgba(0,0,0,.15);
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .register-card h2{
      text-align:center;
      color:#ff6b00;
      font-size:clamp(1.6rem, 4vw, 2rem);
      margin-bottom:10px;
    }

    .register-card input{
      padding:16px;
      border-radius:15px;
      border:2px solid #eee;
      font-size:16px;
      outline:none;
      transition:.3s;
      width:100%;
      font-family:inherit;
    }

    .register-card input:focus{
      border-color:#ff6b00;
      box-shadow:0 0 20px #ffb347;
    }

    .register-card button{
      padding:16px;
      border:none;
      border-radius:15px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      background:linear-gradient(90deg,#ff6b00,#ff9900);
      color:white;
      transition:.4s;
      box-shadow:0 0 15px #ff8800;
    }

    .register-card button:hover{
      transform:translateY(-5px);
      box-shadow:0 0 40px #ff6b00;
    }

    .register-card p{ text-align:center; }
    .register-card a{ color:#ff6b00; text-decoration:none; font-weight:bold; }

    .error{
      display:none;
      color:#e63946;
      font-size:13px;
      margin-top:-12px;
    }
    .error.show{ display:block; }

    @media (max-width: 900px){
      .container{ padding:40px 24px; flex-direction:column; }
      .left{ width:100%; }
      .right{ width:100%; max-width:440px; }
    }

    @media (max-width: 480px){
      .register-card{ padding:28px; border-radius:22px; }
      .chef{ width:200px; height:200px; }
      .food{ font-size:30px; }
    }
  </style>
</head>
<body>

<div class="background" aria-hidden="true">
  <div class="food food1">🍕</div>
  <div class="food food3">🥗</div>
  <div class="food food5">🍩</div>
  <div class="food food6">🥑</div>
  <div class="food food7">🍅</div>
</div>

<div class="container">

  <div class="left">
    <img src="images.jpeg" class="chef" alt="AI chef mascot">
    <h1>Welcome to AI Recipe Generator</h1>
    <p>
      Discover thousands of delicious recipes
      generated by AI.
    </p>
  </div>

  <div class="right">
    <form class="register-card" id="registerForm" novalidate>
      <h2>Create Account</h2>

      <input type="text" id="fullName" placeholder="Full Name" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <div class="error" id="registerError"></div>

      <button type="submit">Create Account</button>

      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </form>
  </div>

</div>

<script>
  const form = document.getElementById("registerForm");
  const errorBox = document.getElementById("registerError");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const pass = document.getElementById("regPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (!name || !email || !pass || !confirm) {
      errorBox.textContent = "Please fill in every field.";
      errorBox.classList.add("show");
      return;
    }
    if (pass !== confirm) {
      errorBox.textContent = "Passwords don't match.";
      errorBox.classList.add("show");
      return;
    }
    errorBox.classList.remove("show");
    window.location.href = "login.html";
  });
</script>

</body>
</html>
