<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Generator - Login</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
      }

      body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow-x:hidden;
        overflow-y:auto;
        padding:24px 16px;
        background:linear-gradient(135deg,#fff9e6,#ffe4c7,#ffe0e9,#fff7c5);
        position:relative;
      }

      /* Floating Food */
      .food{
        position:absolute;
        font-size:55px;
        animation:float 6s ease-in-out infinite;
        user-select:none;
        pointer-events:none;
        filter:drop-shadow(0 8px 10px rgba(0,0,0,.15));
      }
      .food1{ top:6%; left:6%; animation-delay:0s; }
      .food2{ top:18%; right:7%; animation-delay:1s; }
      .food3{ bottom:18%; left:8%; animation-delay:2s; }
      .food4{ bottom:8%; right:10%; animation-delay:3s; }
      .food5{ top:5%; left:45%; animation-delay:4s; }
      .food6{ bottom:6%; left:46%; animation-delay:5s; }
      .food7{ top:50%; left:2%; animation-delay:1.5s; }
      .food8{ top:48%; right:2%; animation-delay:2.5s; }
      .food9{ bottom:3%; left:20%; animation-delay:3.5s; }
      .food10{ top:2%; right:38%; animation-delay:4.5s; }

      @keyframes float{
        0%,100%{ transform:translateY(0px) rotate(0deg); }
        50%{ transform:translateY(-25px) rotate(8deg); }
      }

      /* Login Container */
      .login-container{
        width:1000px;
        max-width:100%;
        min-height:600px;
        display:flex;
        background:rgba(255,255,255,.35);
        backdrop-filter:blur(15px);
        border-radius:30px;
        box-shadow:0 25px 50px rgba(0,0,0,.2);
        overflow:hidden;
      }

      /* Left */
      .left{
        width:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        padding:40px;
        background:rgba(255,255,255,.2);
      }

      .left h1{
        font-size:42px;
        color:#ff6b35;
        margin-top:15px;
      }

      .left p{
        margin-top:15px;
        font-size:18px;
        text-align:center;
        color:#444;
        line-height:30px;
      }

      /* Right */
      .right{
        width:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:24px;
      }

      .login-box{
        width:360px;
        max-width:100%;
        padding:40px;
        background:white;
        border-radius:25px;
        box-shadow:0 15px 40px rgba(0,0,0,.15);
      }

      .login-box h2{
        text-align:center;
        font-size:35px;
        margin-bottom:25px;
        color:#ff6b35;
      }

      /* Inputs */
      .input-box{ margin-bottom:18px; }
      .input-box input{
        width:100%;
        padding:16px;
        font-size:16px;
        border:none;
        outline:none;
        background:#f2f2f2;
        border-radius:12px;
        transition:.3s;
      }
      .input-box input:focus{
        background:white;
        border:2px solid #ff6b35;
        box-shadow:0 0 15px rgba(255,107,53,.3);
      }

      /* Forgot */
      .forgot{ text-align:right; margin-bottom:18px; }
      .forgot a{ text-decoration:none; color:#ff6b35; font-size:14px; }

      /* Login Button */
      .login-btn{
        width:100%;
        padding:15px;
        font-size:18px;
        font-weight:bold;
        border:none;
        cursor:pointer;
        border-radius:50px;
        background:linear-gradient(45deg,#ff6b35,#ff914d);
        color:white;
        transition:.3s;
        box-shadow:0 0 20px #ff914d;
      }
      .login-btn:hover{
        transform:scale(1.05);
        box-shadow:0 0 15px #ff6b35, 0 0 30px #ff6b35, 0 0 45px #ff914d;
      }

      /* OR */
      .or{ margin:20px 0; text-align:center; color:#666; }

      /* Social */
      .social{ display:flex; gap:15px; }
      .social button{
        flex:1;
        padding:13px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        font-weight:600;
        background:#f4f4f4;
        transition:.3s;
      }
      .social button:hover{ background:#ffe9df; }

      /* Register */
      .register{ margin-top:22px; text-align:center; font-size:15px; }
      .register a{ text-decoration:none; color:#ff6b35; font-weight:bold; }

      /* Responsive */
      @media(max-width:900px){
        .login-container{ width:100%; min-height:auto; flex-direction:column; }
        .left{ display:none; }
        .right{ width:100%; padding:35px; }
        .login-box{ width:100%; }
      }

      @media(max-width:480px){
        body{ padding:16px 10px; }
        .login-container{ border-radius:20px; }
        .right{ padding:22px; }
        .login-box{ padding:26px; border-radius:20px; }
        .login-box h2{ font-size:28px; }
        .food{ font-size:34px; }
      }
    </style>
</head>
<body>

<!-- Floating Food Emojis -->

<div class="food food1">🍕</div>
<div class="food food2">🍔</div>
<div class="food food3">🍜</div>
<div class="food food4">🍰</div>
<div class="food food5">🥗</div>
<div class="food food6">🍩</div>
<div class="food food7">🍟</div>
<div class="food food8">🌮</div>
<div class="food food9">🧁</div>
<div class="food food10">🍦</div>

<!-- Main Container -->

<div class="login-container">

    <!-- Left Side -->

    <div class="left">

    
        <h1>Welcome Back!</h1>

        <p>
            Your AI Kitchen Assistant is waiting.
            <br><br>
            Turn simple ingredients into
            delicious recipes in seconds!
        </p>

    </div>

    <!-- Right Side -->

    <div class="right">

        <div class="login-box">

            <h2>Login</h2>

            <form>

                <div class="input-box">
                    <input type="email"
                    placeholder="Email Address"
                    required>
                </div>

                <div class="input-box">
                    <input type="password"
                    placeholder="Password"
                    required>
                </div>

                <div class="forgot">
                    <a href="forgot.html">Forgot Password?</a>
                </div>

                <button class="login-btn">
                    Login
                </button>

                <div class="or">
                    OR
                </div>



                <div class="register">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
