<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AI Recipe Generator</title>
  <link rel="stylesheet" href="forgot.css" />
</head>
<body>
  <!-- Soft glowing background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <!-- Floating food emojis -->
  <div class="food-bg" aria-hidden="true">
    <span class="food" style="--x:8%;  --d:0s;   --dur:14s; --r:-15deg;">🥗</span>
    <span class="food" style="--x:18%; --d:2s;   --dur:18s; --r:20deg;">🍕</span>
    <span class="food" style="--x:28%; --d:4s;   --dur:16s; --r:-10deg;">🍔</span>
    <span class="food" style="--x:38%; --d:1s;   --dur:20s; --r:25deg;">🍜</span>
    <span class="food" style="--x:48%; --d:5s;   --dur:15s; --r:-20deg;">🍩</span>
    <span class="food" style="--x:58%; --d:3s;   --dur:17s; --r:15deg;">🥑</span>
    <span class="food" style="--x:68%; --d:6s;   --dur:19s; --r:-25deg;">🍅</span>
    <span class="food" style="--x:78%; --d:2.5s; --dur:14s; --r:10deg;">🌽</span>
    <span class="food" style="--x:88%; --d:4.5s; --dur:16s; --r:-15deg;">🥕</span>
    <span class="food" style="--x:14%; --d:7s;   --dur:21s; --r:30deg;">🍓</span>
    <span class="food" style="--x:64%; --d:8s;   --dur:18s; --r:-30deg;">🍪</span>
    <span class="food" style="--x:92%; --d:3.5s; --dur:22s; --r:20deg;">🍋</span>
  </div>
  <main class="page">
    <section class="card" role="region" aria-labelledby="fp-title">
      <div class="lock-wrap">
        <div class="lock-ring"></div>
        <div class="lock-icon" aria-hidden="true">🔒</div>
      </div>
      <h1 id="fp-title" class="title">Forgot Password?</h1>
      <p class="subtitle">
        Enter your registered email address and we'll send you a password reset link.
      </p>
      <form id="forgotForm" class="form" novalidate>
        <div class="field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
          </span>
          <input
            type="email"
            id="email"
            name="email"
            class="input"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>
        <div id="errorMsg" class="error" aria-live="polite"></div>
        <button type="submit" id="submitBtn" class="btn-primary">
          <span class="btn-label">
            <span class="btn-emoji">📩</span>
            <span>Send Reset Link</span>
          </span>
          <span class="btn-loading">
            <span class="spinner"></span>
            <span>Sending...</span>
          </span>
        </button>
      </form>
      <div id="successBox" class="success" hidden>
        <div class="success-icon">✅</div>
        <h2 class="success-title">Password reset link sent successfully!</h2>
        <p class="success-text">Please check your email.</p>
        <a href="login.html" class="btn-secondary">← Back to Login</a>
      </div>
      <div class="links">
        <p>Remember your password? <a href="login.html" class="link">Login</a></p>
        <p>Don't have an account? <a href="register.html" class="link">Register</a></p>
      </div>
    </section>
  </main>
  <script src="forgot.js"></script>
</body>
</html>
